name: Dashboard semanal Hotel Centro Huancayo

# Corre todos los lunes 08:00 Lima (13:00 UTC) y también se puede lanzar a mano.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write      # para hacer commit del index.html actualizado
  pages: write         # para publicar en GitHub Pages
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar dashboard
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python generate_dashboard.py

      - name: Commit del HTML actualizado
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add index.html data/history.json
          git commit -m "Actualización automática del dashboard ($(date +%F))" || echo "Sin cambios"
          git push

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
